name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      large_file:
        description: Also run the 1 GiB two-node streaming test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked

  large-file:
    if: github.event_name == 'workflow_dispatch' && inputs.large_file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --locked --test http_integration large_one_gib_two_node_streaming_round_trip -- --ignored --nocapture
